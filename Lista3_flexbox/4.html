<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4</title>
    <style>
        
        .container{
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            height: 100hv;
        }
        .fotos{
            width: 80px;
            height: 300px;
            overflow: hidden;
            flex-grow: 1;
            border-radius: 40px;
            margin: 10px;
        }
        .fotos:hover{
            flex-grow: 100;
            transition: all 5s;
        }
        img{width: 300px;}
        #img1{
            background-image: url(img4/gato1.jpg);
            background-size: cover;
        }
        #img2{
            background-image: url(img4/gato4.jpg);
            background-size: cover;
        }
        #img3{
            background-image: url(img4/gato2.jpg);
            background-size: cover;
        }
        #img4{
            background-image: url(img4/gato3.jpg);
            background-size: cover;
        }
        #img5{
            background-image: url(img4/gato5.jpg);
            background-size: cover;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="fotos" id="img1"></div>

        <div class="fotos" id="img2"></div>

        <div class="fotos" id="img3"></div>

        <div class="fotos" id="img4"></div>

        <div class="fotos" id="img5"></div>
    </div>
    
    
</body>
</html>
