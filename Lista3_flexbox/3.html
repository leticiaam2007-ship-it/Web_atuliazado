<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>
    <style>
        body{background-color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 500%;
            font-family: monospace;
        }
        .layout{
            background-color: white;
            width: 350px;
            height: 550px;
            border: 3px solid gray;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
        }
        .perfil{
            width: 350px;
            height: 110px;
            border: 1px solid lightgrey;
            display: flex;
            
            align-items: center;
            
        }
        img{
            border-radius: 50%;
            width: 50px;
            justify-content: start;
            align-items: start;
            
        }
        .nome{
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .funcao{
            color: darkslategray;
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="layout">
            <div class="perfil"><img src="img4/pessoa1.jpg" alt=""><span class="nome">Luís Inácio Lula Da Silva <br> <span class="funcao">Ex-presidiário</span></span></div>
            

            <div class="perfil"><img src="img4/pessoa2.jpg" alt=""><span class="nome"> Jair Messias Bolsonaro <br> <span class="funcao">Presidiário</span></span></div>

            <div class="perfil"><img src="img4/pessoa3.jpg" alt=""><span class="nome"> Dilma Roussef <br> <span class="funcao">Fugitiva</span></span></div>

            <div class="perfil"><img src="img4/pessoa4.jpg" alt=""><span class="nome"> Nicolas Ferreira <br> <span class="funcao">Chupetinha</span></span></div>

            <div class="perfil"><img src="img4/pessoa5.jpg" alt=""><span class="nome"> Alexandre de Moraes <br> <span class="funcao">Mini-Churros</span></span></div>
        </div>
    </div>
    
</body>
</html>
