<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>
</head>
<body>

    <h1 id="titulo">Calculadora de IMC</h1>

    <label>Nome:</label>
    <input type="text" id="nome">
    <br><br>

    <label>Peso (kg):</label>
    <input type="number" id="peso" step="0.1">
    <br><br>

    <label>Altura (m):</label>
    <input type="number" id="altura" step="0.01">
    <br><br>

    <button onclick="calcularIMC()">Calcular</button>

    <p id="resultadoIMC"></p>
    <p id="classificacao"></p>

    <img id="imgPerfil" width="200">

    <script>

        function calcularIMC() {

            let nome = document.getElementById("nome").value;
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);

            // Verificar campos
            if (nome == "" || isNaN(peso) || isNaN(altura)) {
                alert("Preencha todos os campos!");
                return;
            }

            // Calcular IMC
            let imc = peso / (altura * altura);

            // Mostrar resultado
            document.getElementById("resultadoIMC").innerText =
                nome + ", seu IMC é: " + imc.toFixed(2);

            // Classificação
            let classificacao = "";

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            }
            else if (imc < 24.9) {
                classificacao = "Peso normal";
            }
            else if (imc < 29.9) {
                classificacao = "Sobrepeso";
            }
            else if (imc < 34.9) {
                classificacao = "Obesidade grau 1";
            }
            else if (imc < 39.9) {
                classificacao = "Obesidade grau 2";
            }
            else {
                classificacao = "Obesidade grau 3 (mórbida)";
            }

            document.getElementById("classificacao").innerText =
                "Classificação: " + classificacao;

            // Imagem
            let img = document.getElementById("imagens/perfil.png");
            let faixa = Math.floor(imc);

            switch (true) {

                case (faixa < 18):
                    img.src = "./imagens/abaixopeso.png";
                    break;

                case (faixa >= 18 && faixa < 25):
                    img.src = "./imagens/normal.png";
                    break;

                case (faixa >= 25 && faixa < 30):
                    img.src = "./imagens/sobrepeso.png";
                    break;

                case (faixa >= 30 && faixa < 35):
                    img.src = "./imagens/obesidade1.png";
                    break;

                case (faixa >= 35 && faixa < 40):
                    img.src = "./imagens/obesidade2.png";
                    break;

                default:
                    img.src = "./imagens/obesidade3.png";
            }

        }

    </script>

</body>
</html>
