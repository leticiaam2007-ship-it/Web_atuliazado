<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sorteio de Números</title>
</head>
<body>

    <h1 id="titulo">Sorteio de Números</h1>

    <label>Valor mínimo:</label>
    <input type="number" id="minimo">
    <br><br>

    <label>Valor máximo:</label>
    <input type="number" id="maximo">
    <br><br>

    <button onclick="sortear()">Sortear</button>

    <p id="resultado"></p>

    <h2>Lista de números sorteados</h2>

    <ul id="lista"></ul>

    <script>

        // Array para guardar os números sorteados
        let sorteados = [];

        function sortear() {

            let min = parseInt(document.getElementById("minimo").value);
            let max = parseInt(document.getElementById("maximo").value);

            // Verificação
            if (isNaN(min) || isNaN(max)) {
                alert("Digite os valores mínimo e máximo!");
                return;
            }

            // Gerar número aleatório
            let numero = Math.floor(Math.random() * (max - min + 1)) + min;

            document.getElementById("resultado").innerText =
                "Número sorteado: " + numero;

            // Verificar se já existe
            let encontrado = false;

            for (let i = 0; i < sorteados.length; i++) {

                if (sorteados[i].numero == numero) {
                    sorteados[i].quantidade++;
                    encontrado = true;
                }

            }

            // Se não existir, adiciona
            if (!encontrado) {

                sorteados.push({
                    numero: numero,
                    quantidade: 1
                });

            }

            // Mostrar lista
            let lista = document.getElementById("lista");

            lista.innerHTML = "";

            for (let i = 0; i < sorteados.length; i++) {

                lista.innerHTML +=
                    "<li>Número " +
                    sorteados[i].numero +
                    " → sorteado " +
                    sorteados[i].quantidade +
                    " vez(es)</li>";

            }

        }

    </script>

</body>
</html>
