<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Prompt e Alert</title>
</head>
<body>

    <h1 id="titulo">Utilizando Prompt e Alert</h1>

    <script>

        // Pergunta o nome do usuário
        let nome = prompt("Digite seu nome:");

        // Mostra o nome em um alert
        alert("Olá, " + nome + "!");

    </script>

</body>
</html>
