<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tipos de Variáveis e Operadores</title>
</head>
<body>

    <h1 id="titulo">Tipos de Variáveis e Operadores</h1>

    <button id="botao" onclick="mostrarTipos()">
        Mostrar Tipos e Operações
    </button>

    <h2 id="subtitulo1">Tipos das Variáveis</h2>

    <p id="pstring"></p>
    <p id="pnumero"></p>
    <p id="pboolean"></p>
    <p id="pundefined"></p>
    <p id="pnull"></p>
    <p id="pobjeto"></p>
    <p id="parray"></p>

    <h2 id="subtitulo2">Operações</h2>

    <p id="op1"></p>
    <p id="op2"></p>
    <p id="op3"></p>

    <script>

        function mostrarTipos() {

            // Variáveis
            let texto = "Olá";
            let numero = 10;
            let ligado = true;
            let indefinido;
            let vazio = null;
            let objeto = {nome: "Maria"};
            let lista = [1, 2, 3];

            // Mostrar tipos
            document.getElementById("pstring").innerText =
                "String: " + typeof texto;

            document.getElementById("pnumero").innerText =
                "Number: " + typeof numero;

            document.getElementById("pboolean").innerText =
                "Boolean: " + typeof ligado;

            document.getElementById("pundefined").innerText =
                "Undefined: " + typeof indefinido;

            document.getElementById("pnull").innerText =
                "Null: " + typeof vazio;

            document.getElementById("pobjeto").innerText =
                "Object: " + typeof objeto;

            document.getElementById("parray").innerText =
                "Array: " + typeof lista;

            // Operações
            let resultado1 = texto + numero;
            let resultado2 = ligado * numero;
            let resultado3 = numero + true;

            // Console
            console.log(resultado1);
            console.log(resultado2);
            console.log(resultado3);

            // Mostrar resultados na tela
            document.getElementById("op1").innerText =
                '"Olá" + 10 = ' + resultado1 +
                " -> O número virou texto e foi juntado.";

            document.getElementById("op2").innerText =
                'true * 10 = ' + resultado2 +
                " -> true vale 1 na multiplicação.";

            document.getElementById("op3").innerText =
                '10 + true = ' + resultado3 +
                " -> true vale 1 na soma.";
        }

    </script>

</body>
</html>
